<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NoamEditz1 - אדיטים, תחרויות ותוכן בסטייל. הצטרפו לקהילה של נועם!" />
  <meta name="keywords" content="נועם אדיטים, NoamEditz1, עריכת וידאו, תחרות אדיטים, YouTube, אדיט" />
  <title>NoamEditz1 | האתר הרשמי</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Heebo', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: #0e0e10;
      color: #f2f2f2;
    }

    /* === מסך התחברות === */
    #login-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(160deg, #0e0e10, #101824);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .login-box {
      background: #11141b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .login-box h2 {
      color: #3ba4ff;
      margin-bottom: 25px;
      font-size: 1.8em;
    }

    .login-box input {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #1a1f2b;
      color: #fff;
      font-size: 1em;
    }

    .login-box button {
      width: 100%;
      margin-top: 15px;
      background: #3ba4ff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-box button:hover {
      background: #338bda;
    }

    /* תוכן האתר */
    main { display: none; } /* מוסתר עד שמתחברים */

    header {
      background: linear-gradient(90deg, #0e0e10, #101824);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      position: sticky;
      top: 0;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header h1 {
      color: #3ba4ff;
      font-weight: 800;
      font-size: 1.6em;
    }

    nav a {
      color: #f2f2f2;
      text-decoration: none;
      margin: 0 15px;
      transition: 0.3s;
    }

    nav a:hover { color: #3ba4ff; }

    section {
      padding: 80px 10%;
    }

    .hero {
      text-align: center;
      background: linear-gradient(to bottom, #0e0e10, #101824);
      padding: 100px 10%;
    }

    .hero h2 { font-size: 2.5em; color: #3ba4ff; margin-bottom: 20px; }
    .hero p { font-size: 1.2em; color: #ccc; margin-bottom: 30px; }
    .hero button {
      background: #3ba4ff;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
    }
    .hero button:hover { background: #338bda; }

    footer {
      text-align: center;
      padding: 20px;
      background: #0b0c10;
      color: #777;
    }
  </style>
</head>
<body>
  <!-- מסך התחברות -->
  <div id="login-screen">
    <form id="login-form" class="login-box" method="POST" action="https://formcarry.com/s/wsw98PJ5UvA">
      <h2>התחברות ל-NoamEditz1</h2>
      <input type="email" name="email" placeholder="אימייל" required />
      <input type="password" name="password" placeholder="סיסמה" required />
      <button type="submit">התחבר</button>
      <p id="login-message" style="margin-top:15px; color:#3ba4ff;"></p>
    </form>
  </div>

  <!-- תוכן האתר (מוסתר עד ההתחברות) -->
  <main>
    <header>
      <h1>NoamEditz1</h1>
      <nav>
        <a href="#home">בית</a>
        <a href="#contest">תחרות</a>
        <a href="#community">קהילה</a>
        <a href="#about">עליי</a>
        <a href="#contact">צור קשר</a>
      </nav>
    </header>

    <section id="home" class="hero">
      <h2>ברוכים הבאים ל-NoamEditz1 🎬</h2>
      <p>האדיטים הכי חזקים, האנרגיות הכי גבוהות – והקהילה הכי נאמנה 🔥</p>
      <button onclick="window.open('https://www.youtube.com/channel/UCM8QovN6fSGExubXBPXqPsw/', '_blank')">צפה בערוץ</button>
    </section>

    <footer>
      <p>© 2025 NoamEditz1 | נבנה באהבה ❤️ על ידי נועם</p>
    </footer>
  </main>

  <script>
    const loginForm = document.getElementById('login-form');
    const loginScreen = document.getElementById('login-screen');
    const mainContent = document.querySelector('main');
    const message = document.getElementById('login-message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(loginForm);
      const response = await fetch(loginForm.action, {
        method: "POST",
        body: formData,
        headers: { Accept: "application/json" }
      });

      if (response.ok) {
        message.textContent = "מתחבר...";
        setTimeout(() => {
          loginScreen.style.display = "none";
          mainContent.style.display = "block";
        }, 1000);
      } else {
        message.textContent = "שגיאה בהתחברות. נסה שוב.";
      }
    });
  </script>
</body>
</html>
